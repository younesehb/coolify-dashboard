# Self-host Launchpad with Docker Compose (also works as a Coolify "Docker Compose" resource).
services:
  launchpad:
    image: ghcr.io/younesehb/coolify-dashboard:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      COOLIFY_URL: ${COOLIFY_URL:?Set COOLIFY_URL}
      COOLIFY_TOKEN: ${COOLIFY_TOKEN:?Set COOLIFY_TOKEN}
      COOLIFY_PUBLIC_URL: ${COOLIFY_PUBLIC_URL:-}
      ACTIONS_PASSWORD: ${ACTIONS_PASSWORD:-}
      OWNER_NAME: ${OWNER_NAME:-}
      # Host network traffic for the Network widget (CPU, memory and disk work without it).
      HOST_PROC: /host/proc
      # Containers browser through the read-only proxy below.
      DOCKER_HOST: http://docker-proxy:2375
    volumes:
      - /proc:/host/proc:ro
    depends_on:
      - docker-proxy

  # Only lets "list containers" and "container stats" through to the Docker socket.
  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
