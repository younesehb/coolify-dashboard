# Categories for GitHub's auto-generated release notes.
changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot]
  categories:
    - title: New features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Security
      labels: [security]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ['*']
