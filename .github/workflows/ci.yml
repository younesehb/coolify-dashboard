name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Smoke test in demo mode
        run: |
          DEMO=true PORT=3000 node server.js &
          for i in $(seq 1 20); do curl -fs localhost:3000/api/apps > /tmp/apps.json && break; sleep 0.5; done
          node -e "const d=require('/tmp/apps.json'); if (!d.demo || d.items.length < 10) process.exit(1); console.log(d.items.length + ' demo items')"
          curl -fs localhost:3000/ | grep -q '<div id="root">'
          curl -fs localhost:3000/api/coolify | node -e "const d=JSON.parse(require('fs').readFileSync(0)); if (!d.counts || !d.recent.length) process.exit(1)"
          curl -fs localhost:3000/api/containers | node -e "const d=JSON.parse(require('fs').readFileSync(0)); if (!d.available || d.containers.length < 10) process.exit(1)"
      - name: Host metrics read real /proc
        run: |
          PORT=3001 node server.js &
          sleep 7
          curl -fs localhost:3001/api/metrics > /tmp/m.json
          node -e "const m=require('/tmp/m.json'); if (!m.available || !(m.cores > 0) || !(m.memTotal > 0) || !(m.diskTotal > 0) || m.history.length < 1) { console.error(m); process.exit(1) } console.log(m.cores + ' cores, ' + Math.round(m.memTotal/2**30) + ' GB RAM')"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
